<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites Hub</title>
<style>
  @property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
  :root{
    --bg:#05060a;--panel:rgba(23,25,34,.82);--panel2:rgba(30,33,48,.85);--text:#eceef5;--muted:#8d93a8;--line:#2a2e40;
    --nav:rgba(8,9,14,.78);--input:#050507;--item1:#0b0b10;--item2:#111118;--h1:#fff;--canvas:1;--ink:#111;
  }
  :root[data-theme="light"]{
    --bg:#f2f4f9;--panel:#ffffff;--panel2:#f0f2f8;--text:#1b1e2b;--muted:#667088;--line:#dde1ec;
    --nav:rgba(242,244,249,.85);--input:#ffffff;--item1:#ffffff;--item2:#f6f7fb;--h1:#1b1e2b;--canvas:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{background:transparent;color:var(--text);font-family:"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;min-height:100vh;overflow-x:hidden}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:var(--canvas);transition:opacity .4s}
  button{font-family:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid #818cf8;outline-offset:2px}

  /* ===== global nav ===== */
  .nav{position:sticky;top:0;z-index:30;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .nav-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.5px;background:linear-gradient(90deg,#818cf8,#ec4899,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px;position:relative}
  .tab{position:relative;z-index:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:8px 18px;border-radius:999px;cursor:pointer;transition:color .2s}
  .tab.on{color:#fff}
  .tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:linear-gradient(90deg,#6366f1,#ec4899);box-shadow:0 0 18px rgba(99,102,241,.5);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
  .themebtn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;transition:.15s}
  .themebtn:hover{border-color:#818cf8}

  .panel{display:none}
  .panel.on{display:block;animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== sites panel ===== */
  .swrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  .stop{padding:6px 0 14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .stitle{font-size:24px;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--c,#888)}
  .chip.on{background:var(--c,#888);border-color:var(--c,#888);color:#111}
  .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,#888);margin-right:7px}
  .chip.on i{background:#111}
  .btn{cursor:pointer;border:1px solid var(--c,#818cf8);background:transparent;color:var(--c,#818cf8);padding:8px 16px;border-radius:8px;font-size:13.5px;font-weight:700;transition:.15s}
  .btn:hover{background:var(--c,#818cf8);color:#111}
  .btn.solid{background:var(--c,#818cf8);color:#111}
  .btn.solid:hover{filter:brightness(1.1)}
  .btn.done{background:#22c55e!important;border-color:#22c55e!important;color:#06220f!important}

  .site{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;margin-bottom:20px;overflow:hidden;backdrop-filter:blur(6px)}
  .site.hide{display:none}
  .shead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;flex-wrap:wrap;cursor:pointer}
  .sname{font-size:26px;font-weight:800;color:var(--c);letter-spacing:1px}
  .surl{color:var(--muted);font-size:13.5px}
  .sact{display:flex;gap:8px;align-items:center}
  .arrow{transition:transform .2s;color:var(--muted);font-size:18px;padding:0 4px}
  .site.closed .arrow{transform:rotate(-90deg)}
  .sbody{padding:0 18px 18px;display:block}
  .site.closed .sbody{display:none}
  .block{background:var(--panel2);border-radius:10px;padding:12px 15px;margin-bottom:12px}
  .lbl{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--c);text-transform:uppercase;margin-bottom:6px}
  .block p{font-size:15px}
  .tag{display:inline-block;background:var(--c);color:#111;font-size:11px;font-weight:800;border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .site table{width:100%;border-collapse:collapse;font-size:15px}
  .site td{padding:7px 4px;border-bottom:1px dashed var(--line)}
  .site tr:last-child td{border-bottom:none}
  td.dep{color:var(--muted);width:40%}
  td.pct{color:var(--c);font-weight:800;font-size:18px;width:20%}
  td.act{text-align:right;width:70px}
  .cbbig{font-size:22px;font-weight:800;color:var(--c);margin-bottom:6px}
  .site ul{list-style:none}
  .site li{padding:3px 0 3px 20px;position:relative;font-size:14.5px}
  .site li::before{content:"";position:absolute;left:3px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--c)}
  .site li.mut{color:var(--muted)}
  .wag{font-size:14px;color:var(--muted);padding-top:2px}
  .wag b{color:var(--text)}
  .lc{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:6px;margin-left:10px;white-space:nowrap;transition:.15s}
  .lc:hover{border-color:var(--c);color:var(--c)}
  .lc.done{background:#22c55e;border-color:#22c55e;color:#06220f}
  .line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .note{color:var(--muted);font-size:12.5px;text-align:center;margin-top:10px}

  /* ===== PG search panel ===== */
  .pwrap{max-width:580px;margin:0 auto;padding:12vh 14px 60px;transition:padding .6s cubic-bezier(.2,.8,.2,1)}
  .pwrap.active{padding-top:24px}
  .ptitle{font-size:30px;margin:0 0 22px;text-align:center;letter-spacing:.5px;color:var(--h1)}
  .box{position:relative;border-radius:16px;padding:2px;transition:transform .3s}
  .box::before,.box::after{content:"";position:absolute;inset:0;border-radius:16px;background:conic-gradient(from var(--a),#6366f1,#ec4899,#22d3ee,#6366f1);animation:spin 4s linear infinite}
  .box::before{filter:blur(10px);opacity:.55;transition:opacity .3s}
  .box:focus-within{transform:scale(1.03)}
  .box:focus-within::before{opacity:1}
  @keyframes spin{to{--a:360deg}}
  #q{position:relative;z-index:2;width:100%;padding:17px 20px;font-size:19px;border:0;border-radius:14px;outline:none;background:var(--input);color:var(--text)}
  #q::placeholder{color:#6b7280}
  .count{font-size:13px;color:var(--muted);margin:14px 4px;min-height:16px}
  .item{position:relative;overflow:hidden;cursor:pointer;background:linear-gradient(135deg,var(--item1),var(--item2));border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;opacity:0;animation:pop .55s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s,border-color .25s,box-shadow .25s}
  .item::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.08),transparent);transform:translateX(-120%)}
  .item:hover{transform:translateX(8px) scale(1.02);border-color:#6366f1;box-shadow:0 0 22px rgba(99,102,241,.35),0 0 44px rgba(236,72,153,.15)}
  .item:hover::after{animation:shine .8s ease}
  @keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.92)}60%{opacity:1;transform:translateY(-4px) scale(1.02)}100%{opacity:1;transform:none}}
  @keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
  .pg{font-weight:bold;font-size:19px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  .name{font-size:17px;text-align:right;color:var(--text)}
  .grp{font-size:11px;color:#6b7280;display:block;letter-spacing:.6px;text-transform:uppercase}
  .none{text-align:center;color:#f87171;padding:22px}
  mark{background:#facc15;color:#000;border-radius:3px;padding:0 1px}
  .pg mark{-webkit-text-fill-color:#000}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:#22c55e;color:#06220f;font-weight:700;padding:10px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;font-size:14px;z-index:40}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media(max-width:560px){
    .nav-in{flex-wrap:wrap;justify-content:center}
    .brand{display:none}
    .tab{padding:8px 14px}
    .sname{font-size:22px}td.dep{width:45%}.stitle{font-size:20px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important}}

  /* ===== VIP check panel ===== */
  .vwrap{max-width:580px;margin:0 auto;padding:9vh 14px 60px}
  .vtitle{font-size:30px;margin:0 0 6px;text-align:center;letter-spacing:.5px;color:var(--h1)}
  .vtitle span{filter:drop-shadow(0 0 12px rgba(250,204,21,.6))}
  .vsub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
  .vrow{display:flex;gap:10px;position:relative;z-index:2}
  .vin{width:100%;padding:16px 18px;font-size:18px;border:0;border-radius:14px;outline:none;background:var(--input);color:var(--text)}
  .vin::placeholder{color:#6b7280}
  .vgo{border:0;cursor:pointer;padding:0 24px;border-radius:12px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(90deg,#6366f1,#ec4899);transition:.2s;white-space:nowrap}
  .vgo:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(99,102,241,.45)}
  .vcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px;backdrop-filter:blur(6px)}
  .vcard h2{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin-bottom:14px}
  .vform{display:grid;gap:10px}
  .vform .vin,.vform select{border:1px solid var(--line);padding:14px 16px;font-size:16px;border-radius:12px;background:var(--input);color:var(--text);width:100%;outline:none}
  .vform .vin:focus,.vform select:focus{border-color:#818cf8}
  .vform .vgo{padding:14px}
  .vstats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px;font-size:12.5px;color:var(--muted)}
  .vstats span{background:var(--panel);border:1px solid var(--line);padding:6px 13px;border-radius:999px}
  .vstats b{color:#facc15}
  .vov{position:fixed;inset:0;background:rgba(3,4,10,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
  .vov.show{display:flex}
  .vpop{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:28px 24px;text-align:center;animation:vpop .28s cubic-bezier(.2,1.3,.4,1)}
  @keyframes vpop{from{transform:scale(.8);opacity:0}}
  .vpop.vip{box-shadow:0 0 0 1px rgba(250,204,21,.55),0 0 60px rgba(250,204,21,.25)}
  .vpop.non{box-shadow:0 0 0 1px rgba(248,113,113,.55),0 0 60px rgba(248,113,113,.2)}
  .vic{font-size:52px;margin-bottom:4px}
  .vtag{display:inline-block;padding:7px 20px;border-radius:999px;font-weight:800;letter-spacing:1.5px;font-size:15px;margin:4px 0 12px}
  .vpop.vip .vtag{background:linear-gradient(135deg,#fde047,#f59e0b);color:#3a2500}
  .vpop.non .vtag{background:rgba(248,113,113,.15);color:#f87171;border:1px solid #f87171}
  .vtag.warn{background:rgba(250,204,21,.15)!important;color:#facc15!important;border:1px solid #facc15!important}
  .vuid{color:var(--muted);font-size:14px;margin-bottom:12px}.vuid b{color:var(--text)}
  .vitem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c,#818cf8);border-radius:12px;padding:11px 15px;margin-top:8px}
  .vitem small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .vitem strong{font-size:17px}
  .vitem .b strong{color:var(--c,#818cf8)}
  .vitem .m{text-align:right}.vitem .m strong{color:#facc15}
  .vnote{color:var(--muted);font-size:13.5px;line-height:1.5}
  .vclose{margin-top:18px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:15px;font-weight:700;cursor:pointer}
  .vclose:hover{border-color:#818cf8}
</style>
</head>

<!-- ============ TAB 1: SITES INFO ============ -->

<!-- ============ TAB 2: PG SEARCH ============ -->

    </div>
    <div class="count" id="count"></div>
    <div id="pgList"></div>
  </div>
</main>


<!-- ============ TAB 3: VIP CHECK ============ -->
<main class="panel" id="panel-vip">

    <h1 class="vtitle"><span>👑</span> VIP Checker</h1>

    <div class="box">
      <div class="vrow">
        <input class="vin" id="vq" type="text" inputmode="numeric" placeholder="Enter User ID" autocomplete="off">
        <button class="vgo" id="vqb">Search</button>
      </div>
    </div>
    <div class="vcard">
      <h2>🎯 Filter by ID + Brand</h2>
      <div class="vform">
        <input class="vin" id="vfid" type="text" inputmode="numeric" placeholder="User ID" autocomplete="off">
        <select id="vfb"></select>
        <button class="vgo" id="vfs">Submit</button>
      </div>
    </div>
    <div class="vstats" id="vstats"></div>
  </div>
</main>
<div class="vov" id="vov"><div class="vpop" id="vpop"></div></div>

<div class="toast" id="toast"></div>

<script>
/* ================= shared: toast + copy ================= */
const toast=document.getElementById("toast");
function showToast(msg){toast.textContent=msg;toast.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove("show"),1700)}
async function copy(text,btn,label,msg){
  try{await navigator.clipboard.writeText(text)}
  catch(e){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(_){}t.remove()}
  if(btn){btn.textContent="Copied!";btn.classList.add("done");setTimeout(()=>{btn.textContent=label;btn.classList.remove("done")},1500)}
  showToast(msg);
}

/* ================= tabs ================= */
const tabsEl=document.getElementById("tabs"),pill=document.getElementById("pill");
const tabBtns=[...tabsEl.querySelectorAll(".tab")];
function movePill(){
  const on=tabsEl.querySelector(".tab.on");
  pill.style.width=on.offsetWidth+"px";
  pill.style.transform=`translateX(${on.offsetLeft-4}px)`;
}
function openTab(key){
  tabBtns.forEach(b=>b.classList.toggle("on",b.dataset.tab===key));
  document.getElementById("panel-sites").classList.toggle("on",key==="sites");
  document.getElementById("panel-pg").classList.toggle("on",key==="pg");
  document.getElementById("panel-vip").classList.toggle("on",key==="vip");
  movePill();
  try{history.replaceState(null,"","#"+key)}catch(_){}
  window.scrollTo(0,0);
  if(key==="pg")document.getElementById("q").focus({preventScroll:true});
  if(key==="vip")document.getElementById("vq").focus({preventScroll:true});
}
tabBtns.forEach(b=>b.addEventListener("click",()=>openTab(b.dataset.tab)));
addEventListener("resize",movePill);
document.fonts&&document.fonts.ready.then(movePill);

/* ================= theme ================= */
const themeBtn=document.getElementById("themeBtn");
themeBtn.onclick=()=>{
  const r=document.documentElement;
  const light=r.getAttribute("data-theme")==="light";
  r.setAttribute("data-theme",light?"dark":"light");
  themeBtn.textContent=light?"Light Mode":"Dark Mode";
};

function toText(s){

function parse(text, group) {
  return text.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)\s*\(?\s*(PG\d+)\s*\)?$/i);
    return m ? { name: m[1].trim(), pg: m[2].toUpperCase(), group } : null;
  }).filter(Boolean);
}

const pwrap = document.getElementById("pwrap");

function esc(s){return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hl(text, term){
  if(!term) return esc(text);
  const i = text.toLowerCase().indexOf(term);
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i,i+term.length)) + "</mark>" + esc(text.slice(i+term.length));
}

function render() {
  const term = q.value.trim().toLowerCase();
  if (!term) {
    pwrap.classList.remove("active");
    count.textContent = "";
    pgList.innerHTML = "";
    return;
  }
  pwrap.classList.add("active");
  const digits = /^\d+$/.test(term);
  let res = DATA.filter(d => {
    if (digits) {
      return d.pg.slice(2).replace(/^0+/, "").includes(term.replace(/^0+/, "") || "0") || d.pg.toLowerCase().includes(term);
    }
    return d.pg.toLowerCase().includes(term) || d.name.toLowerCase().includes(term);
  });
  res.sort((a, b) => (b.pg.toLowerCase() === term) - (a.pg.toLowerCase() === term));
  count.textContent = res.length + (res.length === 1 ? " result found" : " results found");
  if (!res.length) { pgList.innerHTML = '<div class="none">No results found</div>'; return; }
  pgList.innerHTML = res.map((d, i) =>
    `<div class="item" data-pg="${d.pg}" title="Click to copy ${d.pg}" style="animation-delay:${Math.min(i,12)*45}ms"><span class="pg">${hl(d.pg, term)}</span><span class="name">${hl(d.name, term)}<span class="grp">${d.group}</span></span></div>`
  ).join("");
}

(function(){
  const c = document.getElementById("bg"), ctx = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, stars = [], mouse = {x:-9999,y:-9999};
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.min(160, Math.floor(w*h/9000));
    stars = Array.from({length:n}, () => ({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.6+.3,
      vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25,
      t:Math.random()*Math.PI*2,
      hue:[235,320,190][Math.floor(Math.random()*3)]
    }));
  }
  function frame(){
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
    for (let i=0;i<stars.length;i++){
      const s = stars[i];
      s.x += s.vx; s.y += s.vy; s.t += .03;
      if (s.x<0) s.x=w; if (s.x>w) s.x=0; if (s.y<0) s.y=h; if (s.y>h) s.y=0;
      const a = .35 + .35*Math.sin(s.t);
      ctx.beginPath();
      ctx.fillStyle = `hsla(${s.hue},90%,75%,${a})`;
      ctx.shadowColor = `hsl(${s.hue},90%,65%)`; ctx.shadowBlur = 8;
      ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
      ctx.shadowBlur = 0;
      for (let j=i+1;j<stars.length;j++){
        const o = stars[j], dx = s.x-o.x, dy = s.y-o.y, d = dx*dx+dy*dy;
        if (d < 12000){
          ctx.strokeStyle = `rgba(129,140,248,${(1-d/12000)*.18})`;
          ctx.lineWidth = .6;
          ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(o.x,o.y); ctx.stroke();
        }
      }
      const mx = s.x-mouse.x, my = s.y-mouse.y, md = mx*mx+my*my;
      if (md < 22000){
        ctx.strokeStyle = `rgba(236,72,153,${(1-md/22000)*.5})`;
        ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke();
      }
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  addEventListener("resize", resize);
  addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener("touchmove", e => { const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY; }, {passive:true});
  resize(); frame();
})();

  document.addEventListener("keydown",ev=>{if(ev.key==="Escape")close()});
  const items=r=>r.map(([b,m])=>`<div class="vitem" style="--c:${colorOf(B[b])}"><div class="b"><small>Brand</small><strong>${e(B[b])}</strong></div><div class="m"><small>VIP Manager</small><strong>${e(M[m])}</strong></div></div>`).join("");
  const vipHtml=(id,r)=>`<div class="vic">👑</div><div class="vtag">VIP USER</div><div class="vuid">User ID: <b>${e(id)}</b></div>${items(r)}`;
  const nonHtml=(id,msg)=>`<div class="vic">🚫</div><div class="vtag">NON-VIP</div><div class="vuid">User ID: <b>${e(id)}</b></div><p class="vnote">${msg}</p>`;
  const warn=(t,msg)=>show(`<div class="vic">⚠️</div><div class="vtag warn">${t}</div><p class="vnote">${msg}</p>`,"non");
  const clean=v=>v.trim().replace(/^0+(?=\d)/,"");
  function quick(){
    const id=clean(g("vq").value);
    if(!/^\d+$/.test(id))return warn("INVALID","Please enter a valid numeric User ID.");
    const r=D[id];
    r?show(vipHtml(id,r),"vip"):show(nonHtml(id,"This User ID was not found in the VIP list of any brand."),"non");
  }
  function filt(){
    const id=clean(g("vfid").value),bi=g("vfb").value;
    if(!/^\d+$/.test(id)||bi==="")return warn("MISSING","Enter a numeric User ID and select a brand.");
    const r=D[id]||[],hit=r.filter(x=>x[0]==bi);
    if(hit.length)return show(vipHtml(id,hit),"vip");
    const other=r.length?`<p class="vnote" style="margin-top:12px">This ID is VIP on other brand(s):</p>${items(r)}`:"";
    show(nonHtml(id,`Not a VIP on <b>${e(B[bi])}</b>.`)+other,"non");
  }
  g("vqb").onclick=quick;g("vfs").onclick=filt;
  g("vq").addEventListener("keydown",ev=>{if(ev.key==="Enter")quick()});
  g("vfid").addEventListener("keydown",ev=>{if(ev.key==="Enter")filt()});
})();

/* start on the tab from URL hash (#pg / #vip / #sites) */
openTab(["pg","vip"].includes(location.hash.slice(1))?location.hash.slice(1):"sites");
</script>
